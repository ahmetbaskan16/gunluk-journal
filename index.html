<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Günlük — kendin için bir alan</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><aside><div class="brand"><span class="dot"></span><div><h1>Günlük</h1><small>kendin için bir alan</small></div></div><button id="new" class="new">+ Yeni Günlük</button><div class="list-head"><span>Notların</span><span id="count">0</span></div><input id="search" class="search" placeholder="Ara veya etiket #..." autocomplete="off"><section id="entries" class="entries"><div class="empty">Henüz bir günlük yok.<br>İlk notunu yazmaya başla.</div></section></aside><section class="editor"><header><div><p class="eyebrow">BUGÜNÜN NOTU</p><input id="title" placeholder="Başlık ekle..." autocomplete="off"><div id="tags" class="tags"></div></div><button id="save" class="save">Kaydet</button></header><textarea id="body" placeholder="Aklından geçenleri buraya bırak..."></textarea><div class="ai-grid"><button id="prompt" class="ai-card"><b>✦ Günün Sorusu</b><span>İlham al, yazmaya başla</span></button><button id="analyze" class="ai-card"><b>◌ Duygu & Mentor</b><span>Bu yazı sana ne söylüyor?</span></button><button id="summary" class="ai-card"><b>◒ Haftalık Özet</b><span>Temalarını ve kazanımlarını gör</span></button></div><section id="insight" class="insight hidden"><div class="insight-head"><span>Günlük içgörüsü</span><button id="closeInsight">×</button></div><div id="insightText"></div></section><footer><span id="status">Yeni bir günlük</span><button id="delete" class="delete hidden">Sil</button></footer></section></main><script src="app.js"></script></body></html>
