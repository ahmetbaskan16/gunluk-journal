<!doctype html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Günlük</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><aside><div class="brand"><span class="dot"></span><div><h1>Günlük</h1><small>kendin için bir alan</small></div></div><button id="new" class="new">+ Yeni Günlük</button><div class="list-head"><span>Notların</span><span id="count">0</span></div><section id="entries" class="entries"><div class="empty">Henüz bir günlük yok.<br>İlk notunu yazmaya başla.</div></section></aside><section class="editor"><header><div><p class="eyebrow">BUGÜNÜN NOTU</p><input id="title" placeholder="Başlık ekle..." autocomplete="off"></div><button id="save" class="save">Kaydet</button></header><textarea id="body" placeholder="Aklından geçenleri buraya bırak..."></textarea><footer><span id="status">Yeni bir günlük</span><button id="delete" class="delete hidden">Sil</button></footer></section></main><script src="app.js"></script></body></html>
